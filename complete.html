<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Challenge Complete!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

    
    <script src="./twa-settings.js" ></script>
    <!-- Lottie Animation Player -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #ffffff, #ffffff);
        }

        .completion-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .animation-container {
            width: 100%;
            max-width: 500px;
            height: 40vh;
            margin: 0 auto;
            position: relative;
        }

        .message-container {
            margin: 20px 0;
            text-align: center;
            padding: 0 20px;
        }

        .message-container h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            margin: 15px 0;
            padding: 0 20px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 1px;
            white-space: nowrap;
            line-height: 1.1;
            display: inline-block;
            text-transform: uppercase;
        }


        .message-container p {
            font-size: 1.4rem;
            color: #555;
            max-width: 500px;
            margin: 30px auto 0;
            line-height: 1.6;
            font-weight: 500;
        }

        .highlight {
            color: #fff;
            background: linear-gradient(90deg, #7b2ff2 0%, #f357a8 100%);
            padding: 0.2em 0.6em;
            border-radius: 0.5em;
            font-weight: 700;
            font-size: 1.1em;
            box-shadow: 0 2px 8px rgba(123, 47, 242, 0.15);
            display: inline-block;
        }



        /* Responsive adjustments */
        @media (max-width: 768px) {
            .animation-container {
                height: 35vh;
            }

            .message-container h1 {
                font-size: 2.5rem;
                margin: 15px 0;
            }

            .message-container p {
                font-size: 1.2rem;
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .animation-container {
                height: 30vh;
            }

            .message-container h1 {
                font-size: 1.8rem;
                margin: 8px 0;
            }

            .message-container p {
                font-size: 0.8rem;
                padding: 0 10px;
                margin-top: 15px;
            }
        }

        @media (max-height: 600px) {
            .animation-container {
                height: 25vh;
            }

            .message-container {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="completion-container">
        <div class="animation-container">
            <dotlottie-player 
                id="completion-animation"
                background="transparent" 
                speed="1" 
                style="width: 100%; height: 100%;" 
                loop 
                autoplay>
            </dotlottie-player>
        </div>
        
        <script>
            // Select random animation immediately and set it
            (function() {
                const animations = [
                    './lottie/girl.lottie',
                    './lottie/complete1.lottie',
                    './lottie/complete2.lottie'
                ];
                const randomIndex = Math.floor(Math.random() * animations.length);
                const selectedAnimation = animations[randomIndex];
                
                // Set the src attribute immediately
                const player = document.getElementById('completion-animation');
                if (player) {
                    player.setAttribute('src', selectedAnimation);
                    console.log('Random animation selected:', selectedAnimation);
                }
            })();
        </script>
        <div class="message-container" id="message-container">
            <h1 id="completion-title">Challenge Completed!</h1>
            <p id="completion-message" style="display:none;"></p>
        </div>

    </div>
    <script>
        // Wait for LogRocket to be available
        function initLogRocket() {
            if (window.LogRocket) {
                window.LogRocket.init('biy3cl/spelling');
                // Track completion page view
                LogRocket.track('Challenge Completion Page View');
                const urlParams = new URLSearchParams(window.location.search);
                const logRocketUserId = urlParams.get("code");
                const logRocketUserName = logRocketUserId; // Using the same code as name
                // Identify user if needed
                if (logRocketUserId) {
                    LogRocket.identify(logRocketUserId, {
                        name: logRocketUserName || 'Spelling Challenge Player',
                        gameType: 'daily_challenge_completion'
                    });
                }
            } else {
                // Retry after a short delay if LogRocket isn't loaded yet
                setTimeout(initLogRocket, 100);
            }
        }

        // Show 'come back after' message if nextQuestion=date is present
        function showComeBackMessageIfNeeded() {
            const urlParams = new URLSearchParams(window.location.search);
            const nextQuestion = urlParams.get('nextQuestion');
            // Check if nextQuestion is a valid ISO date string (from expiresAt.toISOString())
            if (nextQuestion && !isNaN(Date.parse(nextQuestion))) {
                const now = new Date();
                const target = new Date(nextQuestion);
                let diff = target - now;
                if (diff > 0) {
                    let message = '';
                    const seconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const hours = Math.floor(minutes / 60);
                    if (hours > 0) {
                        message = `<span class="highlight">The next test code would be active in <br> ${hours} hour${hours !== 1 ? 's' : ''}</span>`;
                    } else if (minutes > 0) {
                        message = `<span class="highlight">The next test code would be active in <br> ${minutes} minute${minutes !== 1 ? 's' : ''}</span>`;
                    } else {
                        message = `<span class="highlight">The next test code would be active in <br> ${seconds} second${seconds !== 1 ? 's' : ''}</span>`;
                    }
                    const title = document.getElementById('completion-title');
                    const msg = document.getElementById('completion-message');
                    if (title && msg) {
                        title.textContent = 'Come Back Later!';
                        msg.innerHTML = message;
                        msg.style.display = 'block';
                    }
                }
            }
        }

        // Initialize LogRocket when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                initLogRocket();
                showComeBackMessageIfNeeded();
            });
        } else {
            initLogRocket();
            showComeBackMessageIfNeeded();
        }

        setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const testCode = urlParams.get("code") || "";
            if(testCode) {
                console.log("Publishing completed for code:", testCode);
                window.publishCompleted(testCode);
            }
        }, 5000);
    </script>
</body>
</html>
