<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Animation</title>
    <!-- Load Rive.js -->
    <!-- Using a specific version of Rive.js for stability -->
    <!-- Using the latest Rive.js version with better error handling -->
    <script src="https://unpkg.com/@rive-app/canvas@2.10.0"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        #canvas {
            max-width: 80%;
            max-height: 80%;
            width: 600px;
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        // Initialize Rive
        let riveInstance = null;
        
        const initRive = () => {
            // First, load the Rive file
            fetch('thunder2.riv')
                .then(res => res.arrayBuffer())
                .then(rivFile => {
                    // Initialize Rive with the file data
                    riveInstance = new rive.Rive({
                        buffer: rivFile,
                        canvas: document.getElementById('canvas'),
                        autoplay: true,
                        onLoad: () => {
                            console.log('Rive animation loaded successfully');
                            riveInstance.resizeDrawingSurfaceToCanvas();
                            // Add resize listener after Rive is loaded
                            window.addEventListener('resize', handleResize);
                        },
                        onLoadError: (error) => {
                            console.error('Error initializing Rive:', error);
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading Rive file:', error);
                });
        };

        // Handle window resize
        const handleResize = () => {
            if (riveInstance) {
                riveInstance.resizeDrawingSurfaceToCanvas();
            }
        };

        // Initialize Rive when the script loads
        initRive();
    </script>
</body>
</html>
